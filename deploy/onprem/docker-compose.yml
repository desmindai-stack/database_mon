# dbace — production on-prem (tek sunucu)
# Çalıştırma dizini: deploy/onprem  →  docker compose up -d

name: dbace-onprem

services:
  dbace-db:
    image: postgres:16-alpine
    container_name: dbace-db
    environment:
      POSTGRES_USER: dbace
      POSTGRES_PASSWORD: ${DBACE_DB_PASSWORD:?DBACE_DB_PASSWORD gerekli}
      POSTGRES_DB: dbace
    volumes:
      - dbace-pgdata:/var/lib/postgresql/data
      - ../../supabase/migrations/20250717120000_dbace_core.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../supabase/migrations/20250718180000_add_instance_metadata.sql:/docker-entrypoint-initdb.d/02-metadata.sql:ro
      - ../../supabase/migrations/20250718210000_add_slow_query_io_columns.sql:/docker-entrypoint-initdb.d/03-slow-query-io.sql:ro
      - ../../supabase/migrations/20250719140000_query_history_index.sql:/docker-entrypoint-initdb.d/04-query-history-index.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbace -d dbace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dbace-internal

  dbace-app:
    build:
      context: ../..
      dockerfile: deploy/onprem/Dockerfile.backend
    image: dbace/backend:latest
    container_name: dbace-app
    environment:
      DATABASE_URL: postgresql+asyncpg://dbace:${DBACE_DB_PASSWORD}@dbace-db:5432/dbace
      RUN_MODE: all
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?CREDENTIALS_MASTER_KEY gerekli}
      COLLECT_INTERVAL_SECONDS: ${COLLECT_INTERVAL_SECONDS:-15}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-public}
      DEFAULT_CUSTOMER_NAME: ${DEFAULT_CUSTOMER_NAME:-}
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
    depends_on:
      dbace-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dbace-internal

  dbace-web:
    build:
      context: ../..
      dockerfile: deploy/onprem/Dockerfile.web
    image: dbace/web:latest
    container_name: dbace-web
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - dbace-app
    restart: unless-stopped
    networks:
      - dbace-internal

networks:
  dbace-internal:
    driver: bridge

volumes:
  dbace-pgdata:
