# dbace — production on-prem (tek sunucu)
# Çalıştırma dizini: deploy/onprem  →  docker compose up -d
#
# Faz 31 Commit 8:
# - Şema MIGRATION'LARLA kuruluyor: dbace-app açılışta `supabase/migrations` altındaki uygulanmamış
#   dosyaları sırayla uyguluyor (app/migrations_runner.py). Eskiden initdb'ye yalnızca ilk dört migration
#   bağlıydı; yeni kurulum 60 kolon eksik açılıyordu, yükseltme elle yapılıyordu.
# - JWT_SECRET ve ADMIN_PASSWORD ZORUNLU: verilmezse uygulama koddaki geliştirme sırrıyla açılıyordu
#   (oturum jetonları taklit edilebilir).
# - Bütün ayarlar `.env` dosyasından (env_file); açıklamaları `.env.example`'da.

name: dbace-onprem

services:
  dbace-db:
    image: postgres:16-alpine
    container_name: dbace-db
    environment:
      POSTGRES_USER: dbace
      POSTGRES_PASSWORD: ${DBACE_DB_PASSWORD:?DBACE_DB_PASSWORD gerekli}
      POSTGRES_DB: dbace
    volumes:
      - dbace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbace -d dbace"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - dbace-internal

  dbace-app:
    build:
      context: ../..
      dockerfile: deploy/onprem/Dockerfile.backend
    image: dbace/backend:latest
    container_name: dbace-app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dbace:${DBACE_DB_PASSWORD}@dbace-db:5432/dbace
      RUN_MODE: all
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?CREDENTIALS_MASTER_KEY gerekli}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (en az 32 karakter rastgele)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD gerekli (ilk girişte değiştirilecek)}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://127.0.0.1"]}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      dbace-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dbace-internal

  dbace-web:
    build:
      context: ../..
      dockerfile: deploy/onprem/Dockerfile.web.offline
    image: dbace/web:latest
    container_name: dbace-web
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - dbace-app
    restart: unless-stopped
    networks:
      - dbace-internal

networks:
  dbace-internal:
    driver: bridge

volumes:
  dbace-pgdata:
