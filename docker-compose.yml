services:
  postgres-demo:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    volumes:
      - ./docker/init-demo.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: .
      dockerfile: deploy/onprem/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - dbace-data:/app/data
    environment:
      COLLECT_INTERVAL_SECONDS: 15
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    depends_on:
      - postgres-demo
    # Web imajının nginx ayarı API'yi `dbace-app:8000` adresinde arıyor
    # (deploy/onprem/nginx.conf — on-prem paketinin sözleşmesi, değiştirilmiyor).
    # Kök compose servisi `backend` diye adlandırdığı için bu isim çözümlenmiyordu:
    # dashboard 8080'de açılıyor ama HER API çağrısı düşüyordu.
    # Takma ad iki dosyayı, servis adını değiştirmeden uyumlu kılıyor.
    networks:
      default:
        aliases:
          - dbace-app

  frontend:
    build:
      context: .
      dockerfile: deploy/onprem/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - backend
    # nginx yukarı akış adını BAŞLANGIÇTA çözüyor: `dbace-app` henüz ayakta değilse
    # "host not found in upstream" ile ölüyor ve bir daha denemiyor. `depends_on` yalnızca
    # "başladı"yı bekliyor, "hazır"ı değil — backend ilk saniyelerde çıkarsa nginx de
    # kalıcı olarak ölü kalırdı. Yeniden başlatma politikası bu yarışı kapatıyor.
    restart: unless-stopped

volumes:
  dbace-data:
