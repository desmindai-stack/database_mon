# dbace CI — "yerelde yeşil, canlıda patlak" durumunu push anında yakalar (Faz 21 İŞ 1).
#
# Bu dosyanın var olma sebebi üç somut olay:
#   1. `AdviceOut` ileri referansı — yerel Python 3.14 (PEP 649, ertelemeli annotation) sessizce
#      geçti, canlıdaki 3.12 import anında NameError verdi ve API tamamen çöktü.
#   2. `ReportFindingOut`'ta eksik alan — model yazıyordu, şema kırpıyordu.
#   3. `PredictionOut.advice`'ın modelde karşılığı yoktu — API hep null döndü.
#
# Bu yüzden backend işi CANLIYLA AYNI Python sürümünde koşar: deploy/onprem/Dockerfile.backend
# `python:3.12-slim` kullanıyor (Railway bu Dockerfile ile derliyor, bkz. railway.toml).

name: CI

on:
  push:
  pull_request:
  # Gecelik: e2e paketinin TAMAMI burada koşuyor (push'ta yalnızca @critical).
  schedule:
    - cron: "0 2 * * *"
  # Elle tetikleme — tam paketi beklemeden çalıştırmak için.
  workflow_dispatch:

# Aynı dal için üst üste gelen çalıştırmalarda öncekini iptal et — hem hızlı hem ucuz.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          # CANLIYLA AYNI SÜRÜM. Değiştirmeden önce deploy/onprem/Dockerfile.backend'e bakın —
          # ikisi ayrışırsa bu CI'ın yakalamak için var olduğu hata sınıfı geri gelir.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Model bütünlüğü (import + Pydantic + OpenAPI)
        # Testlerden ÖNCE ve ayrı bir adım olarak: canlıyı çökerten hata sınıfı buysa,
        # 750 testin çıktısında kaybolmasın, adım adıyla kırmızı olsun.
        run: python scripts/check_model_integrity.py

      - name: Testler
        run: python -m pytest tests/ -q

  live-postgres:
    name: Canlı PostgreSQL ${{ matrix.pg }}
    # Faz 31 Commit 5: canlı testler CI'da da koşuyor. Kurulum YEREL İLE AYNI betikten
    # (scripts/live_pg.py): pg_stat_statements önyüklü, track_activity_query_size, compute_query_id,
    # logging_collector, hypopg ve hypopg'siz ikinci veritabanı. GitHub'ın `services:` konteynerine
    # sunucu argümanı (shared_preload_libraries) verilemediği için servis değil, betik kullanılıyor.
    #
    # DSN tanımlıyken bir canlı test sürüm koşulu DIŞINDA bir sebeple atlanırsa oturum kırmızı
    # (tests/conftest.py) — "koştu sanılan ama atlanan" kanıt CI'da görünür.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: PostgreSQL ${{ matrix.pg }} konteynerini kur (hypopg dahil)
        run: python scripts/live_pg.py up --versions ${{ matrix.pg }}

      - name: DSN
        # İki satır: DBACE_TEST_PG_DSN ve DBACE_TEST_PG_REPLICA_DSN.
        run: python scripts/live_pg.py dsn --versions ${{ matrix.pg }} >> "$GITHUB_ENV"

      - name: Testler (canlı dahil)
        run: python -m pytest tests/ -q -rs

  live-mssql:
    name: Canlı SQL Server
    # Faz 31 Commit 10c: bu iş olmadan "gerçek sunucuda ölçüldü" iddiaları HİÇ CI'da doğrulanmıyordu —
    # SQL Server testleri yalnızca yerel geliştirme makinesinde koşuyordu. Orada ODBC Driver 18 sessizce
    # kaybolmuştu (Windows Update ya da başka bir kurulum kaldırmış olmalı — commit geçmişinde kayıt yok)
    # ve bu, aylarca bir Query Store hatasını (datetimeoffset, ODBC tip -155) gizlemişti: sürücü YOKKEN
    # bağlantı IM002 ile patlıyor, sürücü kurulunca bu sefer pyodbc'nin çözemediği bir SQL tipiyle
    # patlıyordu — ikisi de gerçek sunucu koşulmadan asla görülemezdi. Sürücü üretim imajıyla
    # (deploy/onprem/Dockerfile.backend) AYNI paketten (`msodbcsql18`) kuruluyor. DSN tanımlıyken bir SQL
    # Server testi ATLANIRSA oturum kırmızı (tests/conftest.py — live-postgres'teki denetimin aynısı);
    # sürücü kurulum adımı başarısız olursa iş zaten o adımda kırmızı olur, testlere hiç sıra gelmez.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: ODBC Driver 18 kur (Microsoft'un resmi Ubuntu paketi — üretim imajıyla aynı sürücü)
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: SQL Server konteynerlerini kur (standalone + Always On, scripts/live_mssql.py)
        run: python scripts/live_mssql.py up

      - name: DSN
        run: python scripts/live_mssql.py env >> "$GITHUB_ENV"

      - name: Testler (canlı dahil)
        run: python -m pytest tests/ -q -rs

  onprem-package:
    name: On-prem paketi (internetsiz kurulum + yükseltme)
    # Faz 31 Commit 8. Bankaya giden paketin kendisi: sürüm arşivi üretiliyor, ağı KAPALI bir
    # docker:dind konteynerinde sıfırdan kuruluyor, kısıtlı rolle bir toplama turu koşuyor ve eski
    # paketle kurulmuş veri dolu bir kurulum yükseltiliyor (satır kaybı 0, şema farkı 0).
    # Uzun sürdüğü için her push'ta değil: gecelik ve elle tetiklemede. Paket ↔ uygulama AYRIŞMASI
    # her push'ta backend işindeki tests/test_onprem_package_drift.py ile denetleniyor.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          # Yükseltme testi eski sürümü git'ten derliyor.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Çevrimdışı bağımlılıkları indir (internetli adım — bankada bu adım yok)
        run: ../deploy/onprem/scripts/prepare-offline-artifacts.sh

      - name: Paket testleri
        run: python -m pytest tests/test_onprem_package_live.py -q -s -rs
        env:
          DBACE_TEST_ONPREM: "1"

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        # `npm ci` package-lock.json'a birebir uyar; `npm install` sürüm kaydırabilir.
        run: npm ci

      - name: Tip kontrolü
        # `npm run build` zaten `tsc -b` çalıştırıyor, ama ayrı adım olarak koşuyoruz ki
        # kırılma tip hatası mı derleme hatası mı, çıktıdan doğrudan görülsün.
        run: npx tsc -b

      - name: Derleme
        run: npm run build

  types:
    name: Tip sürüklenmesi (backend -> TypeScript)
    runs-on: ubuntu-latest
    # Bu iş hem python hem node ister: tipler backend'in OpenAPI şemasından üretiliyor.
    # Amaç, "backend değişti ama tipler güncellenmedi" durumunu push anında yakalamak —
    # elle yazılmış tiplerin API'den sessizce ayrışması canlı çökmelere yol açmıştı.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: |
          pip install -r backend/requirements.txt
          npm --prefix frontend ci

      - name: Tipleri yeniden üret
        run: npm --prefix frontend run gen:types
        env:
          # Depoda .venv yok; betik varsayılan olarak onu arıyor.
          PYTHON: python

      - name: Commit'lenmiş hâlle karşılaştır
        run: |
          if ! git diff --exit-code -- frontend/openapi.json frontend/src/api-types.ts; then
            echo "::error::Üretilen tipler commit'lenmiş hâlinden farklı."
            echo "Backend şeması değişmiş ama tipler güncellenmemiş."
            echo "Düzeltmek için: cd frontend && npm run gen:types  (sonra sonucu commit'leyin)"
            exit 1
          fi

  e2e:
    name: Tarayıcı testleri (Playwright)
    runs-on: ubuntu-latest
    # Gerçek tarayıcıda gerçek tıklama — backend testlerinin göremediği katman. Bu projede
    # yaşanan çökmelerin çoğu (rapor bulgu detayı, silinmiş kayda gitme, boş instance formu)
    # yalnızca burada yakalanabilirdi.
    #
    # Her push'ta YALNIZCA @critical akışlar koşuyor ki CI süresi makul kalsın; tamamı gecelik
    # zamanlamada (aşağıdaki `schedule`) ve elle tetiklemede çalışıyor.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: |
          pip install -r backend/requirements.txt
          npm --prefix frontend ci

      - name: Tarayıcıyı kur
        # Yalnızca chromium: üç tarayıcı indirmek CI süresini üç katına çıkarır ve bu testlerin
        # amacı tarayıcı uyumluluğu değil, uygulama akışlarının çalışması.
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: E2E (kritik akışlar)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: npm --prefix frontend run test:e2e:critical
        env:
          PYTHON: python

      - name: E2E (tamamı)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm --prefix frontend run test:e2e
        env:
          PYTHON: python

      - name: Hata kanıtlarını yükle
        # Başarısız testin ekran görüntüsü, videosu ve izi (trace). İz `npx playwright
        # show-trace <dosya>` ile adım adım incelenebiliyor — CI'da neyin kırıldığını
        # tahmin etmek yerine görmek için.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-hata-kanitlari
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
